name: automerge
description: Enable squash auto-merge on a PR, retrying transient API errors

inputs:
  pr:
    description: Pull request number
    required: true
  token:
    description: GitHub token
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        PR="${{ inputs.pr }}"
        for i in 1 2 3; do
          state_and_auto_merge=$(gh pr view "$PR" --json state,autoMergeRequest --jq '[.state, (.autoMergeRequest != null)] | @tsv') || {
            sleep $((i * 5))
            continue
          }
          read -r state auto_merge <<< "$state_and_auto_merge"
          if [ "$state" = "MERGED" ] || [ "$auto_merge" = "true" ]; then
            exit 0
          fi
          gh pr merge --auto --squash --delete-branch "$PR" && exit 0
          sleep $((i * 5))
        done
        exit 1

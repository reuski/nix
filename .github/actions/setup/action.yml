name: setup
description: Install Nix and configure substituters. Run after actions/checkout.

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      with:
        github_access_token: ${{ github.token }}
        extra_nix_config: |
          experimental-features = nix-command flakes
          download-buffer-size = 536870912
          connect-timeout = 5
          extra-substituters = https://reuski.cachix.org https://cache.nixos-cuda.org
          extra-trusted-public-keys = reuski.cachix.org-1:eIWz4qd8JPuIm9XZxbfSQ802IhhJv2EarUiIG0IXSTs= cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M=

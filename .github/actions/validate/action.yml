name: validate
description: Format and check every flake configuration (builds NixOS hosts, evaluates Darwin)

runs:
  using: composite
  steps:
    - run: nix fmt .
      shell: bash

    - name: Build NixOS host checks
      run: nix flake check --print-build-logs
      shell: bash

    - name: Evaluate Darwin checks
      run: |
        nix eval .#checks.aarch64-darwin --apply 'builtins.mapAttrs (_: d: d.drvPath)'
      shell: bash

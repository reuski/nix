name: validate
description: Check formatting, evaluate Nix expressions, and build smoke tests

runs:
  using: composite
  steps:
    - run: nix flake lock
      shell: bash

    - run: |
        nix shell .#formatter.x86_64-linux -c bash -euo pipefail -c \
          'find . -name "*.nix" -print0 | xargs -0 -r nixfmt'
      shell: bash

    - run: nix eval --raw .#nixosConfigurations.hiisi.config.system.build.toplevel.drvPath
      shell: bash

    - run: nix eval --raw .#nixosConfigurations.shodan.config.system.build.toplevel.drvPath
      shell: bash

    - run: nix eval --raw .#nixosConfigurations.ukko.config.system.build.toplevel.drvPath
      shell: bash

    - run: nix eval --raw .#darwinConfigurations.abraxas.config.system.build.toplevel.drvPath
      shell: bash

    - run: |
        for package in helium-browser python-validity zjstatus; do
          nix eval --raw ".#packages.x86_64-linux.$package.drvPath" >/dev/null
        done
      shell: bash

    - run: |
        for package in python-validity zjstatus; do
          nix build --no-link ".#packages.x86_64-linux.$package"
        done
      shell: bash

name: validate
description: Run flake-checker, evaluate Linux and macOS checks, optionally build Linux checks.

inputs:
  build:
    description: Also build Linux checks (nix flake check --print-build-logs).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: DeterminateSystems/flake-checker-action@3164002371bc90729c68af0e24d5aacf20d7c9f6 # v12
      with:
        fail-mode: true

    - name: Evaluate Linux checks
      shell: bash
      run: |
        nix flake check --no-build

    - name: Evaluate macOS checks
      shell: bash
      run: |
        nix eval .#checks.aarch64-darwin --apply 'builtins.mapAttrs (_: d: d.drvPath)'

    - name: Build Linux checks
      if: inputs.build == 'true'
      shell: bash
      run: |
        nix flake check --print-build-logs

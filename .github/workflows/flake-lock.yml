name: flake-lock

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup

      - name: Update inputs
        run: nix flake update
        timeout-minutes: 8

      - name: Bump helium browser
        run: |
          nix run "github:NixOS/nixpkgs/$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)#nix-update" -- \
            helium-browser --flake \
            --url https://github.com/imputnet/helium-linux \
            --override-filename modules/packages/helium.nix
        timeout-minutes: 10

      - name: Format
        run: nix fmt .
        timeout-minutes: 5

      - name: Evaluate outputs
        run: nix flake check --no-build
        timeout-minutes: 12

      - name: Evaluate macOS
        run: |
          nix eval .#checks.aarch64-darwin --apply 'builtins.mapAttrs (_: d: d.drvPath)'
        timeout-minutes: 8

      - id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: update flake inputs"
          title: "chore: update flake inputs"
          body: "Automated flake input refresh and version bump."
          branch: chore/flake-lock
          delete-branch: true
          labels: automated, flake-lock

      - if: steps.pr.outputs.pull-request-number != ''
        uses: ./.github/actions/automerge
        with:
          pr: ${{ steps.pr.outputs.pull-request-number }}
          token: ${{ secrets.GITHUB_TOKEN }}

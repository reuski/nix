name: flake-lock

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup

      - run: nix flake update

      - run: nix run nixpkgs#nix-update -- helium-browser --flake --url https://github.com/imputnet/helium-linux --override-filename modules/packages/helium.nix

      - uses: ./.github/actions/validate

      - id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "chore: update flake inputs and helium-browser"
          title: "chore: update flake inputs and helium-browser"
          body: "Automated flake input refresh and helium-browser version bump."
          branch: chore/flake-lock
          delete-branch: true
          labels: automated, flake-lock

      - if: steps.pr.outputs.pull-request-number != ''
        uses: ./.github/actions/automerge
        with:
          pr: ${{ steps.pr.outputs.pull-request-number }}
          token: ${{ secrets.GITHUB_TOKEN }}

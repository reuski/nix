name: check

on:
  pull_request:
    paths:
      - "**/*.nix"
      - "flake.lock"
      - "flake.nix"
      - ".sops.yaml"
      - "secrets/**"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - ".github/actions/**"
  merge_group:
  push:
    branches: [main]
    paths:
      - "**/*.nix"
      - "flake.lock"
      - "flake.nix"
      - ".sops.yaml"
      - "secrets/**"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - ".github/actions/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/validate

  nixos:
    needs: evaluate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        host:
          - hiisi
          - sampo
          - shodan
          - ukko
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Build ${{ matrix.host }}
        run: /usr/bin/time -v nix build --no-link ".#checks.x86_64-linux.nixos-${{ matrix.host }}" --print-build-logs

      - name: Size ${{ matrix.host }}
        run: nix path-info --closure-size --human-readable ".#checks.x86_64-linux.nixos-${{ matrix.host }}"

  darwin:
    needs: evaluate
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Build abraxas
        run: /usr/bin/time -l nix build --no-link ".#checks.aarch64-darwin.darwin-abraxas" --print-build-logs

      - name: Size abraxas
        run: nix path-info --closure-size --human-readable ".#checks.aarch64-darwin.darwin-abraxas"

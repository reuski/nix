name: check

on:
  pull_request:
    paths:
      - "**/*.nix"
      - "flake.lock"
      - "flake.nix"
      - ".sops.yaml"
      - "secrets/**"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - ".github/actions/**"
  push:
    branches: [main]
    paths:
      - "**/*.nix"
      - "flake.lock"
      - "flake.nix"
      - ".sops.yaml"
      - "secrets/**"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - ".github/actions/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Verify sops recipients
        run: python3 .github/scripts/check-sops-recipients.py

      - name: Verify private host imports
        run: python3 .github/scripts/check-private-imports.py

      - name: Evaluate checks
        run: nix flake check --no-build --all-systems

  nixos:
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        host:
          - hiisi
          - sampo
          - shodan
          - ukko
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Configure cachix
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: reuski # cachix cache name (app.cachix.org)
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipAddingSubstituter: true

      - name: Build ${{ matrix.host }}
        run: |
          args=()
          if [[ "${{ matrix.host }}" == "sampo" ]]; then
            args+=(--accept-flake-config)
          fi
          /usr/bin/time -v nix build "${args[@]}" --no-link ".#checks.x86_64-linux.nixos-${{ matrix.host }}" --print-build-logs

      - name: Size ${{ matrix.host }}
        run: nix path-info --closure-size --human-readable ".#checks.x86_64-linux.nixos-${{ matrix.host }}"

  darwin:
    needs: evaluate
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Configure cachix
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: reuski # cachix cache name (app.cachix.org)
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipAddingSubstituter: true

      - name: Build abraxas
        run: /usr/bin/time -l nix build --no-link ".#checks.aarch64-darwin.darwin-abraxas" --print-build-logs

      - name: Size abraxas
        run: nix path-info --closure-size --human-readable ".#checks.aarch64-darwin.darwin-abraxas"

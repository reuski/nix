name: update

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Update inputs
        run: nix flake update
        timeout-minutes: 8

      - name: Bump custom packages
        run: |
          nix-update() {
            nix run "github:NixOS/nixpkgs/$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)#nix-update" -- "$@"
          }
          bump() {
            nix-update --flake --version="$1" --url "$2" --override-filename "$3" "$4"
            nix-update --flake --version=skip --url "$2" --override-filename "$3" "$4"
          }
          bump stable https://github.com/imputnet/helium-linux modules/packages/helium.nix helium-browser
          bump branch https://github.com/reuski/reuski.dev modules/packages/web.nix web-reuski-dev
          bump branch https://github.com/reuski/beebud modules/packages/web.nix web-beebud
          bump branch https://github.com/reuski/wahuu.games modules/packages/web.nix web-wahuu-games
        timeout-minutes: 20

      - name: Format
        run: nix fmt .
        timeout-minutes: 5

      - name: Evaluate checks
        run: nix flake check --no-build --all-systems
        timeout-minutes: 10

      - name: Configure cachix
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: reuski # cachix cache name (app.cachix.org)
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build custom packages
        run: |
          nix build --no-link --print-build-logs \
            .#helium-browser \
            .#web-reuski-dev \
            .#web-beebud \
            .#web-wahuu-games
        timeout-minutes: 20

      - id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: update flake inputs"
          title: "chore: update flake inputs"
          body: "Automated flake input refresh and package bump."
          branch: chore/update-flake
          delete-branch: true

      - if: steps.pr.outputs.pull-request-number != ''
        uses: ./.github/actions/automerge
        with:
          pr: ${{ steps.pr.outputs.pull-request-number }}
          token: ${{ secrets.GITHUB_TOKEN }}

name: update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: |
    download-buffer-size = 536870912
    extra-substituters = https://niri.cachix.org https://noctalia.cachix.org https://vicinae.cachix.org https://ghostty.cachix.org
    extra-trusted-public-keys = niri.cachix.org-1:Wv0OmO7PsuocRKzfDoJ3mulSl7Z6oezYhGhR+3W2964= noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4= vicinae.cachix.org-1:1kDrfienkGHPYbkpNj1mWTr7Fm1+zcenzgTizIcI3oc= ghostty.cachix.org-1:QB389yTa6gTyneehvqG58y0WnHjQOqgnA+wBnpWWxns=

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@629b284231c2a82554b724e357e47fc6020833c8 # v3.21.2

      - name: Update inputs
        run: nix flake update
        timeout-minutes: 8

      - name: Bump helium browser
        run: |
          nix run "github:NixOS/nixpkgs/$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)#nix-update" -- \
            helium-browser --flake \
            --url https://github.com/imputnet/helium-linux \
            --override-filename modules/packages/helium.nix
        timeout-minutes: 10

      - name: Format
        run: nix fmt .
        timeout-minutes: 5

      - uses: DeterminateSystems/flake-checker-action@3164002371bc90729c68af0e24d5aacf20d7c9f6 # v12
        with:
          fail-mode: true

      - name: Evaluate Linux checks
        run: nix flake check --no-build
        timeout-minutes: 12

      - name: Evaluate macOS checks
        run: |
          nix eval .#checks.aarch64-darwin --apply 'builtins.mapAttrs (_: d: d.drvPath)'
        timeout-minutes: 8

      - name: Build NixOS checks
        run: nix flake check --print-build-logs
        timeout-minutes: 30

      - id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: update flake inputs"
          title: "chore: update flake inputs"
          body: "Automated flake input refresh and package bump."
          branch: chore/update-flake
          delete-branch: true

      - if: steps.pr.outputs.pull-request-number != ''
        uses: ./.github/actions/automerge
        with:
          pr: ${{ steps.pr.outputs.pull-request-number }}
          token: ${{ secrets.GITHUB_TOKEN }}

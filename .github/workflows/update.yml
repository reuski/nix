name: update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Update inputs
        run: nix flake update
        timeout-minutes: 8

      - name: Bump helium browser
        run: |
          nix-update() {
            nix run "github:NixOS/nixpkgs/$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)#nix-update" -- "$@"
          }
          bump() {
            nix-update --flake --version="$1" --url "$2" --override-filename "$3" "$4"
            nix-update --flake --version=skip --url "$2" --override-filename "$3" "$4"
          }
          bump stable https://github.com/imputnet/helium-linux modules/packages/helium.nix helium-browser
        timeout-minutes: 10

      - name: Bump web apps
        run: |
          nix-update() {
            nix run "github:NixOS/nixpkgs/$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)#nix-update" -- "$@"
          }
          bump() {
            nix-update --flake --version=branch --url "$1" --override-filename modules/packages/web.nix "$2"
            nix-update --flake --version=skip  --url "$1" --override-filename modules/packages/web.nix "$2"
          }
          bump https://github.com/reuski/reuski.dev web-reuski-dev
          bump https://github.com/reuski/beebud web-beebud
          bump https://github.com/reuski/wahuu.games web-wahuu-games
        timeout-minutes: 15

      - name: Format
        run: nix fmt .
        timeout-minutes: 5

      - uses: ./.github/actions/validate
        with:
          build: "true"
        timeout-minutes: 30

      - id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: update flake inputs"
          title: "chore: update flake inputs"
          body: "Automated flake input refresh and package bump."
          branch: chore/update-flake
          delete-branch: true

      - if: steps.pr.outputs.pull-request-number != ''
        uses: ./.github/actions/automerge
        with:
          pr: ${{ steps.pr.outputs.pull-request-number }}
          token: ${{ secrets.GITHUB_TOKEN }}

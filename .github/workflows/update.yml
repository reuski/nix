name: update

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      NIX_CONFIG: warn-dirty = false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/setup

      - uses: ./.github/actions/private-ssh
        with:
          key: ${{ secrets.NIX_BUILDER_KEY }}

      - name: Update inputs
        run: nix flake update
        timeout-minutes: 8

      - name: Update custom packages and web dependency hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nix-update() {
            nix run "github:NixOS/nixpkgs/$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)#nix-update" -- "$@"
          }
          bump() {
            nix-update --flake --version="$1" --url "$2" --override-filename "$3" "$4"
          }
          bump stable https://github.com/imputnet/helium-linux modules/packages/helium.nix helium-browser
          proton_cachyos_version="$(gh api repos/CachyOS/proton-cachyos/releases/latest | jq -er '.tag_name | select(type == "string" and length > 0)')"
          bump "$proton_cachyos_version" https://github.com/CachyOS/proton-cachyos modules/packages/proton.nix proton-cachyos
          bump branch https://github.com/reuski/reuski.dev modules/packages/web.nix web-reuski-dev
          bump branch https://github.com/reuski/beebud modules/packages/web.nix web-beebud
          bump branch https://github.com/reuski/wahuu.games modules/packages/web.nix web-wahuu-games
          # nix-update also refreshes npmDeps; juttu's source is updated via flake.lock.
          nix-update --flake --version=skip --override-filename modules/packages/web.nix web-juttu
        timeout-minutes: 40

      - name: Format
        run: nix fmt .
        timeout-minutes: 5

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- flake.lock modules/packages/; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No updates found.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            git diff --stat -- flake.lock modules/packages/ >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Evaluate checks
        if: steps.changes.outputs.changed == 'true'
        run: |
          git diff --check
          python3 .github/scripts/check-sops-recipients.py
          python3 .github/scripts/check-private-imports.py
          nix flake check --no-build --all-systems
        timeout-minutes: 10

      - name: Configure cachix
        if: steps.changes.outputs.changed == 'true' && env.CACHIX_AUTH_TOKEN != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        with:
          name: reuski # cachix cache name (app.cachix.org)
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipAddingSubstituter: true

      - name: Build custom packages
        if: steps.changes.outputs.changed == 'true'
        run: |
          nix build --no-link --keep-going --print-build-logs \
            .#helium-browser \
            '.#proton-cachyos^steamcompattool' \
            .#python-validity \
            .#web-reuski-dev \
            .#web-beebud \
            .#web-juttu \
            .#web-wahuu-games
        timeout-minutes: 20

      - id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: update flake inputs"
          title: "chore: update flake inputs"
          body: |
            Automated flake input refresh, package bumps, and web dependency hashes.

            Update run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Changed updates pass repository checks, all-system evaluation, and custom
            package builds here. NixOS and Darwin builds run as required PR checks.
          base: ${{ github.event.repository.default_branch }}
          branch: chore/update-flake
          delete-branch: true
          add-paths: |
            flake.lock
            modules/packages/
          token: ${{ secrets.AUTOMATION_TOKEN }}

      - if: steps.pr.outputs.pull-request-number != ''
        uses: ./.github/actions/automerge
        with:
          pr: ${{ steps.pr.outputs.pull-request-number }}
          token: ${{ secrets.AUTOMATION_TOKEN }}

name: update

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - uses: ./.github/actions/private-ssh
        with:
          key: ${{ secrets.NIX_BUILDER_KEY }}

      - name: Update inputs
        run: nix flake update
        timeout-minutes: 8

      - name: Bump custom packages
        run: |
          nix-update() {
            nix run "github:NixOS/nixpkgs/$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)#nix-update" -- "$@"
          }
          bump() {
            nix-update --flake --version="$1" --url "$2" --override-filename "$3" "$4"
            nix-update --flake --version=skip --url "$2" --override-filename "$3" "$4"
          }
          bump stable https://github.com/imputnet/helium-linux modules/packages/helium.nix helium-browser
          proton_cachyos_version="$(curl --fail --silent --show-error --location https://api.github.com/repos/CachyOS/proton-cachyos/releases/latest | jq -r .tag_name)"
          bump "$proton_cachyos_version" https://github.com/CachyOS/proton-cachyos modules/packages/proton.nix proton-cachyos
          proton_cachyos_linuwux_version="$(curl --fail --silent --show-error --location 'https://api.github.com/repos/xshaduwulfx/proton-linuwux/releases?per_page=100' | jq -er '[.[] | select(.draft == false and .prerelease == false and (.tag_name | startswith("proton-cachyos-")))][0].tag_name')"
          bump "$proton_cachyos_linuwux_version" https://github.com/xshaduwulfx/proton-linuwux modules/packages/proton.nix proton-cachyos-linuwux
          bump branch https://github.com/reuski/reuski.dev modules/packages/web.nix web-reuski-dev
          bump branch https://github.com/reuski/beebud modules/packages/web.nix web-beebud
          bump branch https://github.com/reuski/wahuu.games modules/packages/web.nix web-wahuu-games
        timeout-minutes: 20

      - name: Refresh web deps hashes
        run: |
          refresh() {
            local attr=$1 out got
            local name=${attr#web-}
            if out=$(nix build --impure --no-link "path:$PWD#$attr.npmDeps" 2>&1); then
              echo "$name: deps hash up to date"
              return 0
            fi
            got=$(printf '%s\n' "$out" | grep -oE 'got: +sha256-[A-Za-z0-9+/=]+' | head -n1 | awk '{ print $2 }')
            if [ -z "$got" ]; then
              echo "$name: deps probe failed"
              printf '%s\n' "$out" | tail -n 5
              return 1
            fi
            python3 - "$name" "$got" <<'PY'
          import pathlib, re, sys

          name, got = sys.argv[1], sys.argv[2]
          path = pathlib.Path("modules/packages/web.nix")
          source = path.read_text()
          pattern = re.compile(
              r"(\bweb-" + re.escape(name) + r" = bunApp \{.*?depsHash = )\"sha256-[A-Za-z0-9+/=]+\"",
              re.S,
          )
          source, count = pattern.subn(lambda m: m.group(1) + f'"{got}"', source, count=1)
          assert count == 1, f"depsHash for {name} not found"
          path.write_text(source)
          PY
            echo "$name: deps hash -> $got"
          }
          refresh web-juttu
          refresh web-beebud
          refresh web-reuski-dev
          refresh web-wahuu-games
        timeout-minutes: 20

      - name: Format
        run: nix fmt .
        timeout-minutes: 5

      - name: Evaluate checks
        run: nix flake check --no-build --all-systems
        timeout-minutes: 10

      - name: Configure cachix
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: reuski # cachix cache name (app.cachix.org)
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipAddingSubstituter: true

      - name: Build custom packages
        run: |
          nix build --no-link --print-build-logs \
            .#helium-browser \
            '.#proton-cachyos^steamcompattool' \
            '.#proton-cachyos-linuwux^steamcompattool' \
            .#web-reuski-dev \
            .#web-beebud \
            .#web-juttu \
            .#web-wahuu-games
        timeout-minutes: 20

      - id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: update flake inputs"
          title: "chore: update flake inputs"
          body: "Automated flake input refresh and package bump."
          branch: chore/update-flake
          delete-branch: true
          add-paths: |
            flake.lock
            modules/packages/

      - if: steps.pr.outputs.pull-request-number != ''
        uses: ./.github/actions/automerge
        with:
          pr: ${{ steps.pr.outputs.pull-request-number }}
          token: ${{ secrets.GITHUB_TOKEN }}
